<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dodge Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#10131a;color:#fff;font-family:Arial,sans-serif;text-align:center}
h1{margin:18px 0 8px}
#info{font-size:20px;margin-bottom:10px}
#game{position:relative;width:360px;height:600px;margin:auto;overflow:hidden;background:#3b3b3b;border:5px solid #fff;border-radius:10px}
#road{position:absolute;inset:0;background:linear-gradient(90deg,#333 0 8%,#555 8% 92%,#333 92% 100%)}
.line{position:absolute;width:7px;height:70px;background:#fff;left:50%;transform:translateX(-50%)}
.car{position:absolute;width:50px;height:82px;border-radius:10px;z-index:2;box-shadow:0 3px 6px #0008}
#player{bottom:20px;left:155px;background:#2196f3}
.enemy{background:#ef4444}
.car:before{content:"";position:absolute;left:9px;top:10px;width:32px;height:23px;background:#17202a;border-radius:5px}
.car:after{content:"";position:absolute;left:-5px;top:25px;width:8px;height:18px;background:#111;box-shadow:52px 0 #111,0 28px #111,52px 28px #111;border-radius:3px}
#gameOver{display:none;position:absolute;inset:0;background:#000c;z-index:5;align-items:center;justify-content:center;flex-direction:column}
#gameOver h2{font-size:42px;margin:0 0 10px;color:#ff5252}
button{border:0;border-radius:8px;padding:11px 22px;margin:5px;font-size:18px;cursor:pointer;background:#2196f3;color:#fff}
button:hover{background:#1976d2}
.controls{margin:12px auto}
.controls button{width:90px;font-size:24px}
small{color:#bbb}
</style>
</head>
<body>
<h1>🚗 CAR DODGE</h1>
<div id="info">Score: <b id="score">0</b> | Speed: <b id="speed">1</b></div>

<div id="game">
  <div id="road"></div>
  <div id="player" class="car"></div>
  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Your Score: <b id="finalScore">0</b></p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>

<div class="controls">
  <button onclick="move(-1)">⬅️</button>
  <button onclick="move(1)">➡️</button>
</div>
<small>Use Arrow Keys or A / D to move</small>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const speedEl=document.getElementById("speed");
const over=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");

let x=155, score=0, speed=4, running=true, enemies=[];

for(let i=0;i<7;i++){
  const line=document.createElement("div");
  line.className="line";
  line.style.top=(i*100)+"px";
  game.appendChild(line);
}

function move(dir){
  if(!running)return;
  x+=dir*28;
  x=Math.max(8,Math.min(302,x));
  player.style.left=x+"px";
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1);
});

function spawn(){
  if(!running)return;
  const e=document.createElement("div");
  e.className="car enemy";
  e.style.left=Math.floor(Math.random()*302+8)+"px";
  e.style.top="-90px";
  game.appendChild(e);
  enemies.push(e);
}

function hit(a,b){
  const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
  return A.left<B.right&&A.right>B.left&&A.top<B.bottom&&A.bottom>B.top;
}

function loop(){
  if(!running)return;

  document.querySelectorAll(".line").forEach(line=>{
    let y=parseInt(line.style.top)+speed;
    if(y>600)y=-70;
    line.style.top=y+"px";
  });

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    let y=parseInt(e.style.top)+speed;
    e.style.top=y+"px";

    if(hit(player,e)){end();return}

    if(y>620){
      e.remove();
      enemies.splice(i,1);
      score++;
      scoreEl.textContent=score;
      if(score%5===0){speed+=0.5;speedEl.textContent=Math.floor(speed/4);}
    }
  }
  requestAnimationFrame(loop);
}

setInterval(spawn,1100);

function end(){
  running=false;
  finalScore.textContent=score;
  over.style.display="flex";
}

function restart(){
  enemies.forEach(e=>e.remove());
  enemies=[];
  x=155; score=0; speed=4; running=true;
  player.style.left=x+"px";
  scoreEl.textContent="0";
  speedEl.textContent="1";
  over.style.display="none";
  loop();
}

loop();
</script>
</body>
</html>
